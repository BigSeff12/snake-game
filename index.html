<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 600px;
            height: 600px;
        }

        canvas {
            background-color: black;
            border: 2px solid white;
            box-shadow: 0px 0px 20px rgba(0, 255, 0, 0.2);
        }

        #playAgainBtn {
            display: none;
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 24px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: red;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #playAgainBtn:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <button id="playAgainBtn">Play Again</button>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const playAgainBtn = document.getElementById("playAgainBtn");

    // Game Constants
    const SCREEN_WIDTH = 600;
    const SCREEN_HEIGHT = 600;
    const UNIT_SIZE = 25;
    const GAME_UNITS = (SCREEN_WIDTH * SCREEN_HEIGHT) / UNIT_SIZE;
    const DELAY = 75;

    // Game Variables
    let x = new Array(GAME_UNITS);
    let y = new Array(GAME_UNITS);
    let bodyParts = 6;
    let applesEaten = 0;
    let appleX = 0;
    let appleY = 0;
    let direction = 'R';
    let running = false;
    let showHomeScreen = true;
    let gameInterval = null;

    // Asset Loading
    const startImage = new Image();
    startImage.src = "images/snake attack.gif";

    const gameOverImage = new Image();
    gameOverImage.src = "images/die-snake.gif";

    // Event Listeners
    window.addEventListener("keydown", handleKeyPress);
    playAgainBtn.addEventListener("click", resetGame);

    // Main Game Loop Draw Trigger
    draw();

    function startGame() {
        newApple();
        running = true;
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, DELAY);
    }

    function gameLoop() {
        if (running) {
            move();
            checkApple();
            checkCollisions();
        }
        draw();
    }

    function draw() {
        // Clear screen
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

        if (showHomeScreen) {
            if (startImage.complete && startImage.naturalWidth !== 0) {
                ctx.drawImage(startImage, 0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
            }
            showHomeScreenUI();
            drawCopyright();
        } else if (running) {
            // Grid lines
            ctx.strokeStyle = "#111";
            for (let i = 0; i < SCREEN_HEIGHT / UNIT_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * UNIT_SIZE, 0);
                ctx.lineTo(i * UNIT_SIZE, SCREEN_HEIGHT);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * UNIT_SIZE);
                ctx.lineTo(SCREEN_WIDTH, i * UNIT_SIZE);
                ctx.stroke();
            }

            // Apple
            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.arc(appleX + UNIT_SIZE / 2, appleY + UNIT_SIZE / 2, UNIT_SIZE / 2, 0, 2 * Math.PI);
            ctx.fill();

            // Snake
            for (let i = 0; i < bodyParts; i++) {
                if (i === 0) {
                    ctx.fillStyle = "lime";
                } else {
                    ctx.fillStyle = "#30731B";
                }
                ctx.fillRect(x[i], y[i], UNIT_SIZE, UNIT_SIZE);
            }

            // Score display
            ctx.fillStyle = "red";
            ctx.font = "40px 'Times New Roman'";
            ctx.textAlign = "center";
            ctx.fillText("Score: " + applesEaten, SCREEN_WIDTH / 2, 40);
        } else {
            gameOver();
        }
    }

    function showHomeScreenUI() {
        ctx.fillStyle = "lime";
        ctx.textAlign = "center";
        
        ctx.font = "bold 40px Arial";
        ctx.fillText("Welcome to Snake Game!", SCREEN_WIDTH / 2, SCREEN_HEIGHT / 3);

        ctx.font = "30px Arial";
        ctx.fillText("Press Enter to Start", SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2 + 50);
    }

    function drawCopyright() {
        const text = "© 2024 Seth Games Incorporated";
        ctx.fillStyle = "lime";
        ctx.font = "12px Arial";
        ctx.textAlign = "right";
        ctx.fillText(text, SCREEN_WIDTH - 10, SCREEN_HEIGHT - 10);
    }

    function newApple() {
        appleX = Math.floor(Math.random() * (SCREEN_WIDTH / UNIT_SIZE)) * UNIT_SIZE;
        appleY = Math.floor(Math.random() * (SCREEN_HEIGHT / UNIT_SIZE)) * UNIT_SIZE;
    }

    function move() {
        for (let i = bodyParts; i > 0; i--) {
            x[i] = x[i - 1];
            y[i] = y[i - 1];
        }

        switch (direction) {
            case 'U': y[0] -= UNIT_SIZE; break;
            case 'D': y[0] += UNIT_SIZE; break;
            case 'L': x[0] -= UNIT_SIZE; break;
            case 'R': x[0] += UNIT_SIZE; break;
        }
    }

    function checkApple() {
        if (x[0] === appleX && y[0] === appleY) {
            bodyParts++;
            applesEaten++;
            newApple();
        }
    }

    function checkCollisions() {
        // Body collision
        for (let i = bodyParts - 1; i > 0; i--) {
            if (x[0] === x[i] && y[0] === y[i]) {
                running = false;
            }
        }

        // Wall collisions
        if (x[0] < 0 || x[0] >= SCREEN_WIDTH || y[0] < 0 || y[0] >= SCREEN_HEIGHT) {
            running = false;
        }

        if (!running) {
            clearInterval(gameInterval);
        }
    }

    function gameOver() {
        const fontSize = Math.min(Math.floor(SCREEN_WIDTH / 20), 60);
        ctx.fillStyle = "red";
        ctx.font = `${fontSize}px 'Times New Roman'`;
        ctx.textAlign = "center";

        const gameOverText = "C'mon That's Your Best LOL? Game Over";
        const yPos = SCREEN_HEIGHT / 3;

        ctx.fillText(gameOverText, SCREEN_WIDTH / 2, yPos);
        ctx.fillText("Score: " + applesEaten, SCREEN_WIDTH / 2, yPos + fontSize + 20);

        if (gameOverImage.complete && gameOverImage.naturalWidth !== 0) {
            ctx.drawImage(gameOverImage, (SCREEN_WIDTH - 200) / 2, yPos + 100, 200, 200);
        }

        playAgainBtn.style.display = "block";
        drawCopyright();
    }

    function handleKeyPress(e) {
        if (showHomeScreen) {
            if (e.key === "Enter") {
                showHomeScreen = false;
                startGame();
            }
        } else {
            switch (e.key) {
                case "ArrowLeft":
                    if (direction !== 'R') direction = 'L';
                    break;
                case "ArrowRight":
                    if (direction !== 'L') direction = 'R';
                    break;
                case "ArrowUp":
                    if (direction !== 'D') direction = 'U';
                    break;
                case "ArrowDown":
                    if (direction !== 'U') direction = 'D';
                    break;
            }
        }
    }

    function resetGame() {
        bodyParts = 6;
        applesEaten = 0;
        direction = 'R';
        running = true;

        for (let i = 0; i < bodyParts; i++) {
            x[i] = 0;
            y[i] = 0;
        }

        playAgainBtn.style.display = "none";
        startGame();
    }
</script>

</body>
</html>
